plugins {
    id 'com.android.application'
}

android {
    namespace 'com.johorstudio.tether'
    compileSdk 34

    defaultConfig {
        applicationId 'com.johorstudio.tether'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so it installs directly (sideload).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
