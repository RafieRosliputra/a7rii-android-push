name: Build APK

# Builds JS Tether with build-local.sh (same as on the Mac). Runs only when the app changes.
# Signing: add repo secret RELEASE_KEYSTORE_B64 (base64 of release.keystore, password "jstether")
# so the APK installs over the existing app. Without it a throwaway key is used (uninstall the old app first).
on:
  push:
    paths:
      - 'app/**'
      - 'build-local.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: android-sdk
          key: android-sdk-bt34-api33-v1

      - name: Install Android SDK (build-tools 34, platform 33)
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/34.0.0/d8" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;34.0.0" "platforms;android-33" > /dev/null
          fi
          ls "$ANDROID_HOME/build-tools"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            echo "Using release.keystore from secrets"
          else
            keytool -genkeypair -keystore release.keystore -storepass jstether -keypass jstether -alias jstether \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JohorStudio CI, O=JohorStudio, C=MY" > /dev/null 2>&1
            echo "::warning::No RELEASE_KEYSTORE_B64 secret: APK signed with a throwaway key (uninstall the old JS Tether before installing)."
          fi

      - name: Build
        run: BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0" ./build-local.sh

      - uses: actions/upload-artifact@v4
        with:
          name: JSTether-apk
          path: build/JSTether-v*.apk
